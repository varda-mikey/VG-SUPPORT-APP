<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎄 Christmas Price Tag Maker</title>
<style>
:root{--cpm-red:#b51f2a;--cpm-green:#174b32;--cpm-cream:#f7f0dc;--cpm-gold:#c89a3d;--cpm-ink:#27231d;--cpm-muted:#6d6659;--cpm-panel:#fffdf7;--cpm-line:#dfd4b9}*{box-sizing:border-box}.cpm-page{min-height:100vh;margin:0;padding:22px;background:#f1eee7;color:var(--cpm-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.cpm-shell{max-width:1450px;margin:auto}.cpm-titlebar{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.cpm-titlebar h1{margin:0;font-size:clamp(22px,3vw,34px);color:var(--cpm-green)}.cpm-titlebar p{margin:4px 0 0;color:var(--cpm-muted);font-size:14px}.cpm-brand{font-weight:900;letter-spacing:.12em;color:var(--cpm-red);white-space:nowrap}.cpm-layout{display:grid;grid-template-columns:minmax(300px,410px) minmax(0,1fr);gap:20px;align-items:start}.cpm-editor{background:var(--cpm-panel);border:1px solid var(--cpm-line);border-radius:18px;padding:18px;box-shadow:0 10px 30px #0000000b}.cpm-section{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--cpm-line)}.cpm-section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}.cpm-section h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--cpm-green);margin:0 0 10px}.cpm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cpm-field{display:flex;flex-direction:column;gap:5px}.cpm-field.cpm-full{grid-column:1/-1}.cpm-field label{font-size:12px;font-weight:800;color:#514a3f}.cpm-field input,.cpm-field textarea{width:100%;border:1px solid #d8ceb7;background:white;border-radius:10px;padding:10px 11px;font:inherit;color:var(--cpm-ink);outline:none}.cpm-field input:focus,.cpm-field textarea:focus{border-color:var(--cpm-green);box-shadow:0 0 0 3px #174b3214}.cpm-field textarea{min-height:86px;resize:vertical}.cpm-switches{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cpm-switch{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--cpm-line);border-radius:10px;font-size:12px;font-weight:700}.cpm-switch input{accent-color:var(--cpm-red)}.cpm-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.cpm-btn{border:0;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer}.cpm-btn-primary{background:var(--cpm-red);color:white}.cpm-btn-secondary{background:var(--cpm-green);color:white}.cpm-btn-light{background:#eee7d7;color:var(--cpm-ink)}.cpm-preview-wrap{min-width:0}.cpm-preview-label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--cpm-muted);margin:0 0 8px}.cpm-stage{background:#ddd8cc;border-radius:18px;padding:20px;display:flex;justify-content:center;align-items:center;min-height:520px;overflow:auto}.cpm-tag{width:min(100%,900px);aspect-ratio:16/10;display:block;filter:drop-shadow(0 14px 24px #00000020)}.cpm-note{font-size:11px;color:var(--cpm-muted);margin-top:8px;text-align:center}@media(max-width:900px){.cpm-layout{grid-template-columns:1fr}.cpm-stage{min-height:0;padding:12px}.cpm-titlebar{align-items:start;flex-direction:column}}@media(max-width:520px){.cpm-page{padding:10px}.cpm-editor{padding:13px}.cpm-grid,.cpm-switches{grid-template-columns:1fr}.cpm-stage{padding:6px}.cpm-actions .cpm-btn{flex:1}}@media print{body.cpm-printing *{visibility:hidden!important}body.cpm-printing #cpm-print-target,body.cpm-printing #cpm-print-target *{visibility:visible!important}body.cpm-printing #cpm-print-target{position:absolute;left:0;top:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:white}.cpm-page{padding:0;background:white}.cpm-titlebar,.cpm-editor,.cpm-preview-label,.cpm-note{display:none!important}.cpm-stage{padding:0;background:white;min-height:100vh}.cpm-tag{width:100vw;max-height:100vh;filter:none}}
</style></head>
<body><div class="cpm-page" id="christmas-price-maker"><div class="cpm-shell"><header class="cpm-titlebar"><div><h1>🎄 Christmas Price Tag Maker</h1><p>Festive food and product price tags for Christmas promotions.</p></div><div class="cpm-brand">VARDA GROUP</div></header><main class="cpm-layout"><section class="cpm-editor" id="christmas-editor"><div class="cpm-section"><h2>Price Tag Details</h2><div class="cpm-grid"><div class="cpm-field cpm-full"><label>Category</label><input id="cpm-category" value="LUNCH – CHICKEN"></div><div class="cpm-field cpm-full"><label>Product Name</label><input id="cpm-product" value="CHICKEN TERIYAKI"></div><div class="cpm-field"><label>Price</label><input id="cpm-price" value="₱95"></div><div class="cpm-field"><label>Price Label</label><input id="cpm-price-label" value="PER MEAL"></div><div class="cpm-field cpm-full"><label>Description</label><textarea id="cpm-description">Grilled chicken thigh glazed in our signature teriyaki sauce. Served with steamed rice &amp; mixed vegetables.</textarea></div></div></div><div class="cpm-section"><h2>Nutrition</h2><div class="cpm-grid"><div class="cpm-field"><label>Calories</label><input id="cpm-calories" value="360"></div><div class="cpm-field"><label>Carbs</label><input id="cpm-carbs" value="42g"></div><div class="cpm-field"><label>Protein</label><input id="cpm-protein" value="26g"></div><div class="cpm-field"><label>Fat</label><input id="cpm-fat" value="10g"></div></div></div><div class="cpm-section"><h2>Christmas Design</h2><div class="cpm-switches"><label class="cpm-switch"><input type="checkbox" id="cpm-theme" checked> Christmas theme</label><label class="cpm-switch"><input type="checkbox" id="cpm-ornaments" checked> Ornaments</label><label class="cpm-switch"><input type="checkbox" id="cpm-pine" checked> Pine branches</label><label class="cpm-switch"><input type="checkbox" id="cpm-stars" checked> Stars</label><label class="cpm-switch"><input type="checkbox" id="cpm-tree" checked> Christmas tree</label><label class="cpm-switch"><input type="checkbox" id="cpm-nutrition" checked> Nutrition</label><label class="cpm-switch"><input type="checkbox" id="cpm-brand" checked> Varda branding</label></div><div class="cpm-actions"><button class="cpm-btn cpm-btn-primary" id="cpm-png">Download PNG</button><button class="cpm-btn cpm-btn-secondary" id="cpm-print">Print</button><button class="cpm-btn cpm-btn-light" id="cpm-reset">Reset</button></div></div></section><section class="cpm-preview-wrap"><div class="cpm-preview-label">Live Preview</div><div class="cpm-stage" id="cpm-print-target"><svg id="cpm-svg" class="cpm-tag" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="cpm-note">Fixed 16:10 printable ratio. PNG export contains only the finished tag.</div></section></main></div></div>
<script>(function(){'use strict';const root=document.getElementById('christmas-price-maker');if(!root)return;const $=s=>root.querySelector(s),ids=['category','product','price','price-label','description','calories','carbs','protein','fat'];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));const val=id=>$('#cpm-'+id).value.trim();function wrap(t,n){const a=String(t||'').split(/\s+/),o=[];let l='';a.forEach(w=>{const x=l?l+' '+w:w;if(x.length>n){if(l)o.push(l);l=w}else l=x});if(l)o.push(l);return o.slice(0,3)}function render(){const festive=$('#cpm-theme').checked,orn=$('#cpm-ornaments').checked,pine=$('#cpm-pine').checked,stars=$('#cpm-stars').checked,tree=$('#cpm-tree').checked,nut=$('#cpm-nutrition').checked,brand=$('#cpm-brand').checked,bg=festive?'#f7f0dc':'#fff',red=festive?'#b51f2a':'#333',green=festive?'#174b32':'#444',gold=festive?'#c89a3d':'#777';const product=esc(val('product')||'PRODUCT NAME').toUpperCase(),category=esc(val('category')||'CATEGORY').toUpperCase(),price=esc(val('price')||'₱0'),label=esc(val('price-label')||'PER MEAL').toUpperCase();let s=`<rect width="1600" height="1000" rx="36" fill="${bg}"/><rect x="25" y="25" width="1550" height="950" rx="28" fill="none" stroke="${gold}" stroke-width="4"/>`;s+=`<path d="M45 170C130 120 185 110 280 125L260 190C180 165 115 180 55 225Z" fill="${green}"/><path d="M1310 50C1410 80 1490 120 1550 205" fill="none" stroke="${green}" stroke-width="25" stroke-linecap="round"/><path d="M1340 75C1420 110 1490 150 1545 230" fill="none" stroke="${gold}" stroke-width="5"/>`;if(orn)s+=`<g stroke="#fff" stroke-width="4"><circle cx="120" cy="90" r="24" fill="${red}"/><circle cx="1450" cy="115" r="28" fill="${gold}"/><circle cx="1510" cy="185" r="18" fill="${red}"/><circle cx="250" cy="105" r="16" fill="${gold}"/></g>`;if(stars)s+=`<g fill="${gold}"><path d="M370 82l9 22 24 2-18 15 6 23-21-12-21 12 6-23-18-15 24-2z"/><path d="M1230 210l8 19 21 2-16 13 5 20-18-10-18 10 5-20-16-13 21-2z"/></g>`;if(tree)s+=`<g transform="translate(78 720)"><path d="M0 150L72 35l72 115H0Z" fill="${green}"/><path d="M18 105L72 18l54 87H18Z" fill="#24613f"/><path d="M72 150v35" stroke="#6b4326" stroke-width="18"/><circle cx="48" cy="105" r="8" fill="${red}"/><circle cx="94" cy="85" r="8" fill="${gold}"/></g>`;s+=`<g transform="translate(360 150)"><rect width="780" height="76" rx="38" fill="${red}"/><text x="390" y="50" text-anchor="middle" fill="white" font-size="29" font-family="Georgia,serif" font-weight="700" letter-spacing="4">${category}</text></g><text x="800" y="345" text-anchor="middle" fill="${green}" font-size="92" font-family="Georgia,serif" font-weight="900">${product}</text>`;wrap(val('description'),76).forEach((l,i)=>s+=`<text x="800" y="470" dy="${i*38}" text-anchor="middle" fill="#625b4f" font-size="28" font-family="Arial,sans-serif">${esc(l)}</text>`);s+=`<g transform="translate(1190 275)"><rect width="310" height="285" rx="30" fill="${red}"/><text x="155" y="85" text-anchor="middle" fill="white" font-size="24" font-family="Arial,sans-serif" font-weight="800" letter-spacing="3">PRICE</text><text x="155" y="175" text-anchor="middle" fill="white" font-size="70" font-family="Arial,sans-serif" font-weight="900">${price}</text><text x="155" y="225" text-anchor="middle" fill="#ffe7b1" font-size="22" font-family="Arial,sans-serif" font-weight="800">${label}</text></g>`;if(nut){s+=`<g transform="translate(345 575)"><rect width="870" height="150" rx="22" fill="#fffaf0" stroke="${gold}" stroke-width="3"/><text x="435" y="36" text-anchor="middle" fill="${green}" font-size="18" font-family="Arial,sans-serif" font-weight="900" letter-spacing="3">NUTRITION INFORMATION</text>`;[['CALORIES',val('calories')],['CARBS',val('carbs')],['PROTEIN',val('protein')],['FAT',val('fat')]].forEach((x,i)=>{const cx=110+i*220;s+=`<text x="${cx}" y="80" text-anchor="middle" fill="#756c5d" font-size="16" font-family="Arial,sans-serif" font-weight="800">${x[0]}</text><text x="${cx}" y="118" text-anchor="middle" fill="${red}" font-size="26" font-family="Arial,sans-serif" font-weight="900">${esc(x[1]||'—')}</text>`});s+=`</g>`}s+=`<path d="M250 825C500 875 1100 875 1350 825" fill="none" stroke="${green}" stroke-width="14" stroke-linecap="round"/><path d="M250 852C550 905 1050 905 1350 852" fill="none" stroke="${gold}" stroke-width="6"/>`;if(pine)s+=`<path d="M340 900l55-45 48 35 55-48 55 38 55-45 55 38M1110 900l55-45 48 35 55-48 55 38" fill="none" stroke="${green}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;if(brand)s+=`<g transform="translate(1250 55)"><circle cx="30" cy="30" r="27" fill="${red}"/><path d="M18 39l12-22 12 22z" fill="white"/><text x="70" y="26" fill="${green}" font-size="20" font-family="Arial,sans-serif" font-weight="900">VARDA</text><text x="70" y="48" fill="#6d6659" font-size="13" font-family="Arial,sans-serif" font-weight="800" letter-spacing="3">GROUP</text></g>`;s+=`<text x="800" y="950" text-anchor="middle" fill="${red}" font-size="20" font-family="Georgia,serif" font-weight="700" letter-spacing="4">MERRY CHRISTMAS • FROM VARDA GROUP</text>`;$('#cpm-svg').innerHTML=s}ids.forEach(id=>$('#cpm-'+id).addEventListener('input',render));['theme','ornaments','pine','stars','tree','nutrition','brand'].forEach(id=>$('#cpm-'+id).addEventListener('change',render));$('#cpm-reset').onclick=()=>location.reload();$('#cpm-png').onclick=()=>{const svg=$('#cpm-svg'),data='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg)),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=3200;c.height=2000;c.getContext('2d').drawImage(img,0,0,3200,2000);const a=document.createElement('a');a.download=(val('product')||'christmas-price-tag').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.png';a.href=c.toDataURL('image/png');a.click()};img.src=data};$('#cpm-print').onclick=()=>{document.body.classList.add('cpm-printing');window.print();setTimeout(()=>document.body.classList.remove('cpm-printing'),800)};render()})();</script></body></html>
