<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VARDA GROUP RETAIL AUDIT</title><style>:root{--red:#7d1025;--gold:#f5c400;--line:#222}*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#111}.bar{background:var(--red);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.actions{display:flex;gap:7px}button{border:0;border-radius:5px;padding:9px 13px;font-weight:900;cursor:pointer}.print{background:#fff;color:var(--red)}.page{max-width:1600px;margin:18px auto;padding:0 12px}.paper{background:#fff;border:1px solid #bbb}.head{background:var(--red);color:#fff;padding:18px 20px 14px;text-align:center}.logoText{font-size:13px;font-weight:900;letter-spacing:.08em}.head h1{margin:4px 0 0;font-size:28px}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;text-align:left}.field label{display:block;font-size:9px;font-weight:900;margin-bottom:3px}.field input{width:100%;height:30px;border:1px solid #bbb;border-radius:3px;padding:5px}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}col.mark{width:6%}col.form{width:39%}col.assign{width:16%}col.ack{width:14%}col.check{width:7%}col.rem{width:18%}th{background:var(--gold);color:#111;border:1px solid #222;padding:9px 7px;font-size:13px;font-weight:900}td{border:1px solid #222;padding:7px 6px;height:38px;vertical-align:middle}td.mark{text-align:center;font-size:20px;font-weight:900;color:var(--red)}td.form{font-weight:900}td.assign{text-align:center;font-weight:800}input.cell,textarea.cell{width:100%;border:1px solid #bbb;border-radius:2px;min-height:28px;padding:4px;font:inherit}textarea.cell{resize:vertical}.section td{background:#111;color:#fff;font-size:12px;font-weight:900;text-align:left;letter-spacing:.04em;height:34px}.footrow td{height:42px;font-weight:900}.footrow input{border:0;border-bottom:1px solid #222;width:80%;height:25px}.legend{padding:10px 12px;font-size:10px}.screenOnly{display:block}@media(max-width:800px){.meta{grid-template-columns:1fr 1fr}table{min-width:1000px}}@media print{@page{size:A4 landscape;margin:7mm}body{background:#fff}.bar,.screenOnly{display:none!important}.page{max-width:none;margin:0;padding:0}.head{padding:8px 10px}.head h1{font-size:20px}.meta{gap:4px;margin-top:6px}.field label{font-size:7px}.field input{height:20px;font-size:8px}table{font-size:8px}th{font-size:8px;padding:5px}td{padding:4px;height:27px}.section td{font-size:8px;height:24px}input.cell,textarea.cell{min-height:18px;font-size:7px}.legend{font-size:7px;padding:5px}}</style></head><body><div class="bar screenOnly"><div class="brand">VARDA GROUP RETAIL AUDIT<br><small>Daily Form Checklist</small></div><div class="actions"><button class="print" id="print">PRINT AUDIT</button><button id="clear">CLEAR</button></div></div><main class="page"><section class="paper"><header class="head"><div class="logoText">VARDA GROUP</div><h1>DAILY FORM CHECKLIST</h1><div class="meta"><div class="field"><label>BRANCH / SITE</label><input id="branch"></div><div class="field"><label>DATE</label><input id="date" type="date"></div><div class="field"><label>CHECKED BY</label><input id="checkedBy"></div></div></header><div class="wrap"><table><colgroup><col class="mark"><col class="form"><col class="assign"><col class="ack"><col class="check"><col class="rem"></colgroup><thead><tr><th></th><th>FORMS</th><th>ASSIGNED TO</th><th>ACKNOWLEDGE BY</th><th>CHECK</th><th>REMARKS</th></tr></thead><tbody id="rows"></tbody></table></div><div class="legend"><b>CHECK MARKS:</b> △ = Required / verify carefully &nbsp;&nbsp; ○ = Left-over / recurring verification &nbsp;&nbsp; ✓ = Completed &nbsp;&nbsp; ✕ = Missing / not completed</div></section></main><script>const rows=[
['','COOKED FOOD ENDORSEMENT FORM','KITCHEN'],
['△','INGREDIENT FORM 1ST DAY','KITCHEN'],
['△','INGREDIENT FORM 2ND DAY','KITCHEN'],
['','KITCHEN INVENTORY FORM','KITCHEN'],
['','COOKED FOOD INVENTORY','FOOD SERVER'],
['○','LEFT OVER INVENTORY 1ST DAY','FOOD SERVER'],
['○','LEFT OVER INVENTORY 2-3 DAY','KITCHEN'],
['','INVENTORY FRONT','CASHIER'],
['','COACH SUMMARY REPORT','CASHIER'],
['','SALES DECLARATION','CASHIER'],
['section','UTAK VS ACTUAL REPORT',''],
['','INPUT COOKED FOOD TO UTAK','CASHIER'],
['','REMOVE LEFT OVER FROM UTAK','MANAGER / CASHIER'],
['','UTAK INV VS ACTUAL INV','MANAGER AUDIT']
];const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const tb=document.getElementById('rows');tb.innerHTML=rows.map((r,i)=>r[0]==='section'?'<tr class="section"><td colspan="6">UTAK VS ACTUAL REPORT</td></tr>':`<tr><td class="mark">${esc(r[0])}</td><td class="form">${esc(r[1])}</td><td class="assign">${esc(r[2])}</td><td><input class="cell ack" data-i="${i}"></td><td><input class="cell chk" data-i="${i}" placeholder="✓ / △ / ○ / ✕"></td><td><textarea class="cell rem" data-i="${i}" rows="1"></textarea></td></tr>`).join('');document.querySelectorAll('input,textarea').forEach(e=>{if(e.id!=='date')e.addEventListener('input',save);});document.querySelectorAll('.ack,.chk,.rem').forEach(e=>e.addEventListener('input',save));}function save(){const d={branch:branch.value,date:date.value,checkedBy:checkedBy.value,rows:{}};document.querySelectorAll('[data-i]').forEach(e=>{(d.rows[e.dataset.i]??={})[e.className.split(' ')[1]||'v']=e.value});localStorage.setItem('vardaDailyFormChecklist',JSON.stringify(d));}function load(){date.value=new Date().toISOString().slice(0,10);try{const d=JSON.parse(localStorage.getItem('vardaDailyFormChecklist')||'null');if(!d)return;branch.value=d.branch||'';date.value=d.date||date.value;checkedBy.value=d.checkedBy||'';document.querySelectorAll('[data-i]').forEach(e=>{const x=d.rows?.[e.dataset.i];if(x)e.value=x[e.className.split(' ')[1]]||'';});}catch(e){}}document.getElementById('print').onclick=()=>window.print();document.getElementById('clear').onclick=()=>{if(confirm('Clear this Daily Form Checklist?')){localStorage.removeItem('vardaDailyFormChecklist');location.reload();}};render();load();</script></body></html>
