name: Integrate VG enhanced modules
on:
  push:
    paths:
      - '.github/workflows/integrate-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route enhanced modules and add Catering card
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); org='    <div class=\"card\"><div class=\"icon\">🏢</div><h2>Organizational Chart Maker</h2><p>Flexible Varda branch organization chart with direct preview editing, photos, department lines, column control, and Left/Right/Down placement tools.</p><button onclick=\"openSystem(\x27orgchart\x27,\x27Organizational Chart Maker\x27)\">Open Org Chart</button></div>'; cat='    <div class=\"card\"><div class=\"icon\">🍽️</div><h2>Catering Form Maker</h2><p>Create catering service requests, automatic costing and analysis, editable previews, school themes, signatures, and print/PDF-ready forms.</p><button onclick=\"openSystem(\x27catering\x27,\x27Catering Form Maker\x27)\">Open Catering Form Maker</button></div>'; s=s if \"openSystem('catering','Catering Form Maker')\" in s else s.replace(org,org+'\\n\\n'+cat,1); route=\"  else if(key==='schedule') frame.src='schedule-v2.html?v=2';\"; s=s if \"key==='catering'\" in s else s.replace(route,route+\"\\n  else if(key==='catering') frame.src='catering-v1.html?v=1';\",1); p.write_text(s,encoding='utf-8')"
      - name: Commit launcher integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Catering Form Maker to VG Support'
          git push
