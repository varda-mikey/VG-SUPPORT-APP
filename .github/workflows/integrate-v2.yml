name: Integrate VG enhanced modules
on:
  push:
    paths:
      - '.github/workflows/integrate-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Retail Audit card and route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          card='''    <div class="card"><div class="icon">📋</div><h2>VARDA GROUP RETAIL AUDIT</h2><p>Complete branch audit checklist for National & Regional Retail Operations.</p><button onclick="openSystem('retail-audit','VARDA GROUP RETAIL AUDIT')">Open Retail Audit</button></div>\n'''
          if "openSystem('retail-audit','VARDA GROUP RETAIL AUDIT')" not in s:
              marker='''    <div class="card"><div class="icon">🍽️</div><h2>Catering Form Maker</h2><p>Create catering service requests, automatic costing and analysis, editable previews, school themes, signatures, and print/PDF-ready forms.</p><button onclick="openSystem('catering','Catering Form Maker')">Open Catering Form Maker</button></div>\n'''
              if marker not in s: raise SystemExit('Catering card marker not found')
              s=s.replace(marker,marker+'\n'+card,1)
          if "key==='retail-audit'" not in s:
              route="  else if(key==='catering') frame.src='catering-v1.html?v=3';"
              if route not in s: raise SystemExit('Catering route marker not found')
              s=s.replace(route,route+"\n  else if(key==='retail-audit') frame.src='retail-audit-v1.html?v=1';",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit launcher integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Route Retail Audit from VG Support'
          git push
