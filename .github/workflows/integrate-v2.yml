name: Integrate VG enhanced modules
on:
  push:
    paths:
      - '.github/workflows/integrate-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route Utility and Schedule to enhanced modules
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='  frame.srcdoc=decodeHtml(key);'; new=\"  frame.removeAttribute('src');\\n  frame.removeAttribute('srcdoc');\\n  if(key==='utility') frame.src='utility-v2.html?v=2';\\n  else if(key==='schedule') frame.src='schedule-v2.html?v=2';\\n  else frame.srcdoc=decodeHtml(key);\"; p.write_text(s if \"frame.src='utility-v2.html?v=2'\" in s else s.replace(old,new,1),encoding='utf-8')"
      - name: Commit launcher integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Route Utility and Schedule to enhanced modules'
          git push
