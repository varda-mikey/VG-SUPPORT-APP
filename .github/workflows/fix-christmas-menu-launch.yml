name: Fix Christmas Price Tag Maker launch
on:
  push:
    paths:
      - '.github/workflows/fix-christmas-menu-launch.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix isolated iframe launch bridge
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='function launch(){var f=document.getElementById("toolFrame")||document.querySelector("iframe.toolFrame")||document.querySelector("iframe[id*=tool]")||document.querySelector("iframe[srcdoc]");if(f){try{f.removeAttribute("srcdoc")}catch(e){}f.src=URL;f.style.display="block"}else location.href=URL}'
          new='function launch(){var f=document.getElementById("toolFrame")||document.querySelector("iframe.toolFrame")||document.querySelector("iframe[id*=tool]")||document.querySelector("iframe[srcdoc]");if(f){try{f.removeAttribute("srcdoc")}catch(e){}var b=document.body;b.classList.add("toolMode");var t=document.getElementById("toolTitle");if(t)t.textContent="Christmas Price Tag Maker";f.src=URL;f.style.display="block"}else location.href=URL}'
          if old not in s:
              raise SystemExit('Expected Christmas launch bridge not found; aborting safely')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-christmas-menu-launch.yml
          git commit -m 'Fix Christmas Price Tag Maker launch mode'
          git push
