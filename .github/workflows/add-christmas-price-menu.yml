name: Add Christmas Price Tag Maker menu entry
on:
  push:
    paths:
      - '.github/workflows/add-christmas-price-menu.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main app safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='VG_CPM_MENU_ENTRY_V1'
          if marker in s:
              raise SystemExit(0)
          injection='''<script id="vg-cpm-menu-entry-v1">(function(){'use strict';var URL="christmas-price-v1.html";function launch(){var f=document.getElementById("toolFrame")||document.querySelector("iframe.toolFrame")||document.querySelector("iframe[id*=tool]")||document.querySelector("iframe[srcdoc]");if(f){try{f.removeAttribute("srcdoc")}catch(e){}f.src=URL;f.style.display="block"}else location.href=URL}function add(){if(document.querySelector("[data-vg-cpm-entry=1]"))return true;var a=document.querySelectorAll("button,a,[role=button],div"),s=null;for(var i=0;i<a.length;i++){var t=(a[i].textContent||"").replace(/\\s+/g," ").trim();if(/Price Tag Maker/i.test(t)&&!/Christmas/i.test(t)){s=a[i];break}}if(!s)return false;var c=s.cloneNode(true);c.setAttribute("data-vg-cpm-entry","1");c.removeAttribute("id");c.removeAttribute("href");c.removeAttribute("onclick");c.removeAttribute("data-system");c.removeAttribute("data-tool");c.removeAttribute("data-key");c.innerHTML="<div style=\"font:inherit\">🎄 Christmas Price Tag Maker</div><small style=\"display:block;margin-top:4px;opacity:.75\">Create festive Christmas-themed food and product price tags.</small>";c.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();launch()},true);s.parentNode.insertBefore(c,s.nextSibling);return true}function boot(){if(add())return;var n=0,t=setInterval(function(){if(add()||++n>30)clearInterval(t)},300);try{new MutationObserver(add).observe(document.body,{childList:true,subtree:true})}catch(e){}}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot()})();</script>'''
          i=s.lower().rfind('</body>')
          if i<0: raise SystemExit('No </body>; aborting')
          p.write_text(s[:i]+injection+'\n'+s[i:],encoding='utf-8')
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-christmas-price-menu.yml
          git commit -m 'Add Christmas Price Tag Maker menu entry'
          git push
